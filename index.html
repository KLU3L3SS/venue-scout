<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Private</title>
<style>
:root{--bg:#0A0D0C;--panel:#101512;--ink:#E6ECE5;--muted:#8C978E;--line:#222B26;--acc:#FF6B3D;color-scheme:dark}
html,body{margin:0;height:100%}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
.lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.lock form{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:28px 26px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.lock h1{margin:0;font-size:22px}.lock p{margin:0;color:var(--muted);font-size:13.5px}
.lock input{font:600 22px ui-monospace,Menlo,monospace;letter-spacing:.3em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lock button{font:600 15px system-ui,sans-serif;padding:10px;border:0;border-radius:9px;background:var(--acc);color:#fff;cursor:pointer}
.lock button:disabled{opacity:.6}.err{color:#C2341B;font-size:13px;min-height:1em}
</style></head><body>
<div class="lock" id="lock"><form id="f" autocomplete="off"><h1>Private</h1><p>Enter the passcode to continue.</p>
<input id="pass" type="password" aria-label="Passcode" autocomplete="current-password" required>
<div class="err" id="err"></div><button id="go" type="submit">Continue</button></form></div>
<script>
(async function(){
const $=s=>document.querySelector(s);
const vault=await fetch("data/vault.json",{cache:"no-store"}).then(r=>r.json());
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(p){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(vault.salt),iterations:vault.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(vault.iv)},key,u(vault.ct))));
}
async function launch(d){
  window.__VS=d;const t=document.createElement("div");t.innerHTML=d.app;
  const scripts=[...t.querySelectorAll("script")];scripts.forEach(s=>s.remove());
  const title=t.querySelector("title");if(title){document.title=title.textContent;title.remove();}
  $("#lock").remove();document.body.append(...t.childNodes);
  for(const s of scripts){await new Promise(res=>{const n=document.createElement("script");
    if(s.src){n.src=s.src;n.onload=res;n.onerror=res;document.body.appendChild(n);}else{n.textContent=s.textContent;document.body.appendChild(n);res();}});}
}
let saved=null;try{saved=localStorage.getItem("vs-pass");}catch(e){}
if(saved){try{await launch(await open_(saved));return;}catch(e){try{localStorage.removeItem("vs-pass");}catch(_){}}}
$("#pass").focus();
$("#f").onsubmit=async e=>{e.preventDefault();const p=$("#pass").value;$("#go").disabled=true;$("#err").textContent="Checking…";
  let d;try{d=await open_(p);}catch(x){$("#err").textContent="That passcode didn't work.";$("#go").disabled=false;$("#pass").select();return;}
  try{localStorage.setItem("vs-pass",p);}catch(x){}await launch(d);};
})();
</script></body></html>
