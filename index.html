<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><style>html,body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Private</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-screen survey map; list rail on the left, dossier panel slides in from the right. */
:root{
  --bg:#E9ECE7; --land:#F7F8F4; --land-hi:#FFFFFF; --edge:#C3CABF; --state:#9AA597; --outside:#DDE2DA;
  --ink:#18201A; --muted:#5D675E; --line:#D3D9CF; --panel:#FBFCF9; --chip:#E3E8E0;
  --haunt:#D0451C; --haunt-soft:#F6D9CD; --vr:#5446DB; --vr-soft:#DCD9FA;
  --home:#0B8A68; --home-soft:#CDEEE3; --warn:#9A6A00;
  --shadow:0 10px 30px rgba(24,32,26,.14);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D110F; --land:#161D19; --land-hi:#1C251F; --edge:#2B362F; --state:#4A574D; --outside:#111713;
  --ink:#E4EAE3; --muted:#8E998F; --line:#26302A; --panel:#121814; --chip:#1E2822;
  --haunt:#FF6B3D; --haunt-soft:#3A1C12; --vr:#968DFF; --vr-soft:#221F45;
  --home:#38D6A3; --home-soft:#0F3328; --warn:#E6B341; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D110F; --land:#161D19; --land-hi:#1C251F; --edge:#2B362F; --state:#4A574D; --outside:#111713;
  --ink:#E4EAE3; --muted:#8E998F; --line:#26302A; --panel:#121814; --chip:#1E2822;
  --haunt:#FF6B3D; --haunt-soft:#3A1C12; --vr:#968DFF; --vr-soft:#221F45;
  --home:#38D6A3; --home-soft:#0F3328; --warn:#E6B341; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent,var(--haunt));outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;--accent:var(--haunt);--accent-soft:var(--haunt-soft)}
.app[data-tab="vr"]{--accent:var(--vr);--accent-soft:var(--vr-soft)}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:5}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:7px;align-items:center}
.tabs button .dot{width:9px;height:9px;border-radius:50%}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.stat{display:flex;flex-direction:column}
.stat small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.hdr-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:#C2341B;border-color:currentColor;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}

.main{position:relative;display:grid;grid-template-columns:320px 1fr;min-height:0}
.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;z-index:3}
.rail-top{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row label{font-size:12px;color:var(--muted)}
select.sm{padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:12.5px;max-width:100%}
.list{overflow:auto;flex:1;min-height:0}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.item:hover,.item.hot{background:var(--accent-soft)}
.item.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .pip{width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--accent)}
.item .pip.closed{background:none;border:2px solid var(--muted)}
.item .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .sub{grid-column:2;color:var(--muted);font-size:12px}
.item .val{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:3}
.item .val small{display:block;color:var(--muted);font-size:10.5px}
.empty{padding:28px 18px;color:var(--muted);line-height:1.5}

.mapwrap{position:relative;min-width:0;overflow:hidden;background:var(--outside)}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map:active{cursor:grabbing}
.county{fill:var(--land);stroke:var(--edge);stroke-width:.7px;vector-effect:non-scaling-stroke}
.county:hover{fill:var(--land-hi)}
.state{fill:none;stroke:var(--state);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
.state.il{stroke:var(--ink);stroke-width:1.6px;stroke-dasharray:none;opacity:.55}
.nstate{fill:var(--bg);stroke:none}
.ring{fill:none;stroke:var(--home);stroke-width:1.2px;vector-effect:non-scaling-stroke;stroke-dasharray:6 5;opacity:.8}
.ring-lbl{font-family:var(--f-mono);font-size:10.5px;fill:var(--home);paint-order:stroke;stroke:var(--outside);stroke-width:3px}
.clabel{font-size:11px;fill:var(--muted);font-weight:500;paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.clabel.big{font-weight:600;fill:var(--ink);font-size:12px}
.cdot{fill:var(--muted);pointer-events:none}
.colabel{font-size:9.5px;fill:var(--state);letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.pin{cursor:pointer;outline:none}
.pin:focus-visible circle.halo{opacity:.35}
.pin circle.core{fill:var(--accent);stroke:var(--land-hi);stroke-width:1.5px;transition:r .18s ease}
.pin circle.halo{fill:var(--accent);opacity:0;transition:opacity .18s,r .18s}
.pin.closed circle.core{fill:var(--land-hi);stroke:var(--muted);stroke-width:2px}
.pin.hot circle.halo,.pin.sel circle.halo{opacity:.22}
.pin.dim{opacity:.18}
.home circle{fill:var(--home);stroke:var(--land-hi);stroke-width:2px}
.home text{font-weight:700;font-size:12px;fill:var(--home);paint-order:stroke;stroke:var(--land);stroke-width:3.5px}

.bubble{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;min-width:190px;max-width:260px;transform:translate(-50%,calc(-100% - 16px)) scale(.85);opacity:0;transition:opacity .15s,transform .18s cubic-bezier(.2,.9,.3,1.3);z-index:4}
.bubble.on{opacity:1;transform:translate(-50%,calc(-100% - 16px)) scale(1)}
.bubble h4{margin:0 0 2px;font-family:var(--f-display);font-size:15px;line-height:1.15}
.bubble .t{color:var(--muted);font-size:12px;margin-bottom:6px}
.bubble dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:12px}
.bubble dt{color:var(--muted)} .bubble dd{margin:0;font-family:var(--f-mono);text-align:right}
.bubble .hint{margin-top:6px;font-size:11px;color:var(--accent)}

.mapctl{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:2}
.mapctl button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;box-shadow:var(--shadow)}
.legend{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:5px;z-index:2;max-width:calc(100% - 80px)}
.legend .k{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend label{display:flex;gap:6px;align-items:center;cursor:pointer}
.placing{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:999px;font-weight:600;z-index:4;box-shadow:var(--shadow)}

.panel{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:6}
.panel.open{transform:none}
.p-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;padding-right:max(18px,env(safe-area-inset-right,0px))}
.p-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.p-head .meta{color:var(--muted);margin-top:4px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--chip);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.closed{background:none;border:1px solid var(--muted);color:var(--muted)}
.p-body{overflow:auto;flex:1;padding:6px 18px 18px;padding-right:max(18px,env(safe-area-inset-right,0px))}
.p-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sec{padding:12px 0;border-bottom:1px dashed var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.big3 div{background:var(--bg);border-radius:10px;padding:9px 10px;min-width:0}
.big3 small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.big3 b{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:7px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.unk{color:var(--warn);font-style:italic}
.note{color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:4px}
.cities{display:flex;flex-direction:column;gap:3px;font-size:13px}
.cities div{display:flex;justify-content:space-between;gap:10px}
.src a{color:var(--accent);word-break:break-all;font-size:12.5px;display:block;margin-bottom:3px}
.est{font-size:10px;font-weight:700;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
form.edit{display:flex;flex-direction:column;gap:10px;padding-top:8px}
form.edit label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
form.edit input,form.edit select,form.edit textarea{padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px;color:var(--ink);font-weight:400}
form.edit textarea{min-height:64px;resize:vertical}
form.edit .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.edit .help{font-weight:400;font-size:11.5px}
.confirm{background:var(--haunt-soft);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);margin-left:auto;padding:2px 6px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.mode{font-size:11.5px;color:var(--muted)}
#industryWrap{flex-shrink:0;max-height:42%;overflow:auto;border-bottom:1px solid var(--line)}
#industryWrap:empty{display:none}
.industry{margin:10px 14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;background:var(--bg)}
.industry summary{cursor:pointer;font-weight:600}
.industry .b{padding:8px 0;border-top:1px dashed var(--line);margin-top:8px}
.railtoggle{display:none}
#addBtn,#editBtn{display:none!important}
.lock{--accent:var(--haunt);position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lock form{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 26px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
.lock h1{margin:0;font-family:var(--f-display);font-size:22px}
.lock p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.lock input{font:600 22px var(--f-mono);letter-spacing:.3em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lock .err{color:#C2341B;font-size:13px;min-height:1em}
@media (max-width:760px){
  .main{grid-template-columns:1fr}
  .rail{position:absolute;inset:0 auto 0 0;width:min(340px,88%);transform:translateX(-102%);transition:transform .3s;box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .railtoggle{display:inline-flex}
  .stats{order:5;width:100%;margin-left:0;gap:14px;flex-wrap:nowrap;overflow-x:auto}
  .stat small{font-size:9.5px;white-space:nowrap}
  .stat b{font-size:13px}
  .mode{display:none}
  .panel{top:auto;height:72%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%)}
  .panel.open{transform:none}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app" data-tab="haunt">
  <header>
    <button class="btn ghost railtoggle" id="railBtn" aria-label="Show list">☰ List</button>
    <div class="brand"><b>Illinois Venue Scout</b><span id="subtitle">Haunted attractions · statewide</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-haunt" aria-selected="true" data-tab="haunt"><span class="dot" style="background:var(--haunt)"></span>Haunted houses</button>
      <button role="tab" id="tab-vr" aria-selected="false" data-tab="vr"><span class="dot" style="background:var(--vr)"></span>VR venues</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="hdr-actions">
      <span class="mode" id="mode"></span>
      <button class="btn primary" id="addBtn">+ Add location</button>
    </div>
  </header>
  <div class="main">
    <aside class="rail" id="rail">
      <div class="rail-top">
        <input class="search" id="q" type="search" placeholder="Search name, town, county…" autocomplete="off">
        <div class="row">
          <label for="sort">Sort</label>
          <select class="sm" id="sort"></select>
          <label for="ftype">Type</label>
          <select class="sm" id="ftype"></select>
        </div>
      </div>
      <div id="industryWrap"></div>
      <div class="list" id="list"></div>
    </aside>
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="img" aria-label="Map of Illinois with venue locations">
        <g id="world"><g id="gStates"></g><g id="gCounties"></g><g id="gStateLines"></g><g id="gRings"></g></g>
        <g id="gCoLabels"></g><g id="gCities"></g><g id="gHome"></g><g id="gPins"></g>
      </svg>
      <div class="bubble" id="bubble"></div>
      <div class="placing" id="placing" hidden>Click the map to place this location · Esc to cancel</div>
      <div class="legend" id="legend"></div>
      <div class="mapctl">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zfit" aria-label="Show all of Illinois">⤢</button>
      </div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="lock" id="lock"><form id="lockForm" autocomplete="off"><h1>Private</h1><p>Enter the passcode to continue.</p><input id="pass" type="password" inputmode="text" autocomplete="current-password" aria-label="Passcode" required><div class="err" id="lockErr"></div><button class="btn primary" type="submit" id="unlockBtn">Open map</button></form></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function(){
"use strict";
const HOME = {name:"Your Harvard building", town:"Harvard", lat:42.4222, lng:-88.6137};
const TYPES = {
  haunt:["Large commercial","Small/independent","Home/backyard","Charity/community","Trail/hayride","Escape/immersive horror"],
  vr:["Free-roam arena","VR arcade","VR escape room","Entertainment center w/ VR","Immersive/mixed reality"]
};
// Field schema per tab: same system drives the panel, the edit form and the list.
const F = {
  haunt:[
    {k:"name",l:"Name",t:"text",req:1},{k:"type",l:"Type",t:"select",opts:TYPES.haunt},{k:"status",l:"Status",t:"select",opts:["open","closed"]},
    {k:"town",l:"Town",t:"text"},{k:"county",l:"County",t:"text"},{k:"address",l:"Address",t:"text"},
    {k:"ticket_price_ga",l:"Avg ticket price ($)",t:"num"},{k:"price_low",l:"Lowest price ($)",t:"num"},{k:"price_high",l:"Highest price ($)",t:"num"},{k:"vip_price",l:"VIP / fast pass ($)",t:"num"},{k:"price_basis",l:"How the average was figured",t:"area"},{k:"ticket_price_notes",l:"Ticket notes",t:"area"},
    {k:"duration_min",l:"Walkthrough time (min)",t:"num"},{k:"duration_notes",l:"Walkthrough notes",t:"area"},
    {k:"annual_attendance",l:"Customers per year",t:"num"},{k:"attendance_notes",l:"Attendance notes",t:"area"},
    {k:"season",l:"Season / dates",t:"text"},{k:"website",l:"Website",t:"text"},{k:"notes",l:"Notes",t:"area"},{k:"sources",l:"Sources (one URL per line)",t:"list"}
  ],
  vr:[
    {k:"name",l:"Name",t:"text",req:1},{k:"brand",l:"Brand",t:"text"},{k:"type",l:"Type",t:"select",opts:TYPES.vr},{k:"status",l:"Status",t:"select",opts:["open","closed"]},
    {k:"town",l:"Town",t:"text"},{k:"county",l:"County",t:"text"},{k:"address",l:"Address",t:"text"},
    {k:"price_per_person",l:"Avg price per person ($)",t:"num"},{k:"price_low",l:"Lowest price ($)",t:"num"},{k:"price_high",l:"Highest price ($)",t:"num"},{k:"price_basis",l:"How the average was figured",t:"area"},{k:"price_notes",l:"Price notes",t:"area"},
    {k:"session_min",l:"Session length (min)",t:"num"},{k:"group_size",l:"Group size",t:"text"},{k:"avg_group_notes",l:"Group notes",t:"area"},
    {k:"monthly_revenue",l:"Monthly revenue ($)",t:"num"},{k:"annual_revenue",l:"Annual revenue ($)",t:"num"},{k:"revenue_notes",l:"Revenue notes",t:"area"},
    {k:"rent_monthly",l:"Monthly rent ($)",t:"num"},{k:"rent_notes",l:"Rent notes",t:"area"},{k:"sq_ft",l:"Square feet",t:"num"},
    {k:"opened",l:"Year opened",t:"num"},{k:"num_stations_or_arenas",l:"Stations / arenas",t:"text"},
    {k:"website",l:"Website",t:"text"},{k:"notes",l:"Notes",t:"area"},{k:"sources",l:"Sources (one URL per line)",t:"list"}
  ]
};

const $ = s=>document.querySelector(s);

  usd:v=>!isNum(v)?null:v===0?"Free":"$"+(v>=1000?Math.round(v).toLocaleString():Number.isInteger(v)?String(v):v.toFixed(2)),
  int:v=>isNum(v)?Math.round(v).toLocaleString():null,
  big:v=>!isNum(v)?null:v>=1e6?(v/1e6).toFixed(v>=1e7?1:2)+"M":v>=1e4?Math.round(v/1e3)+"K":Math.round(v).toLocaleString(),

const show = (v)=>v==null||v===""?UNK:v;
function miles(a,b,c,d){const R=3958.8,r=Math.PI/180,dp=(c-a)*r,dl=(d-b)*r;const h=Math.sin(dp/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function median(a){a=a.filter(isNum).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2;}

// ---------- census-based population (used when a location is added or moved) ----------
function popFor(rec){
  const C = state.census; if(!C||!isNum(rec.lat)||!isNum(rec.lng)) return;
  const town=(rec.town||"").split(",")[0].replace(/\s+IL$/i,"").trim().toLowerCase();
  const il=C.places.filter(p=>p[1]==="IL");
  let m=il.filter(p=>p[0].toLowerCase()===town).sort((a,b)=>miles(rec.lat,rec.lng,a[3],a[4])-miles(rec.lat,rec.lng,b[3],b[4]))[0];
  if(m&&miles(rec.lat,rec.lng,m[3],m[4])>25)m=null;
  if(m){rec.town_pop=m[2];rec.town_pop_note=m[0]+", 2024 Census estimate";}
  else{const n=il.reduce((b,p)=>{const d=miles(rec.lat,rec.lng,p[3],p[4]);return !b||d<b.d?{p,d}:b;},null);
    rec.town_pop=n.p[2];rec.town_pop_note=`No incorporated match for '${rec.town||""}'; nearest town ${n.p[0]} (${n.d.toFixed(1)} mi), 2024 Census estimate`;}
  let p25=0,p50=0;for(const t of C.tracts){if(Math.abs(t[0]-rec.lat)>1)continue;const d=miles(rec.lat,rec.lng,t[0],t[1]);if(d<=50){p50+=t[2];if(d<=25)p25+=t[2];}}
  rec.region_pop_25=p25;rec.region_pop_50=p50;
  const w=C.places.map(p=>[p,miles(rec.lat,rec.lng,p[3],p[4])]).filter(x=>x[1]<=50);
  rec.region_towns_50=w.length;
  rec.nearby_cities=w.filter(x=>x[0][2]>=15000).sort((a,b)=>b[0][2]-a[0][2]).slice(0,6).map(([p,d])=>({name:p[0]+", "+p[1],pop:p[2],mi:Math.round(d)}));
}
function geocodeTown(name){
  const C=state.census;if(!C)return null;const n=name.split(",")[0].replace(/\s+IL$/i,"").trim().toLowerCase();
  return C.places.filter(p=>p[1]==="IL"&&p[0].toLowerCase()===n).sort((a,b)=>b[2]-a[2])[0]||null;
}

// ---------- map ----------
const svg=d3.select("#map"), world=d3.select("#world");
let proj, path, zoom, T=d3.zoomIdentity, geo;
function size(){const r=$("#mapwrap").getBoundingClientRect();return [Math.max(r.width,200),Math.max(r.height,200)];}
function setupMap(){
  const [w,h]=size();
  const ilFeat={type:"FeatureCollection",features:geo.counties};
  proj=d3.geoMercator().fitExtent([[24,24],[w-24,h-24]],ilFeat);
  path=d3.geoPath(proj);
  d3.select("#gStates").selectAll("path").data(geo.states.filter(s=>s.properties.name!=="Illinois")).join("path").attr("class","nstate").attr("d",path);
  d3.select("#gCounties").selectAll("path").data(geo.counties).join("path").attr("class","county").attr("d",path)
    .on("click",(e)=>{if(state.placing)placeAt(e);});
  d3.select("#gStateLines").selectAll("path").data(geo.states).join("path").attr("class",d=>"state"+(d.properties.name==="Illinois"?" il":"")).attr("d",path);
  drawRings();
  svg.on("click.bg",(e)=>{if(state.placing&&e.target.tagName==="svg")placeAt(e);});
  if(!zoom){
    zoom=d3.zoom().scaleExtent([1,80]).clickDistance(8).tapDistance(12).on("zoom",e=>{T=e.transform;world.attr("transform",T);drawOverlay();hideBubble();});
    svg.call(zoom).on("dblclick.zoom",null);
  }
  svg.call(zoom.transform,T);
}
function drawRings(){
  const g=d3.select("#gRings");g.selectAll("*").remove();
  if(!state.rings)return;
  for(const r of [25,50]){
    const c=d3.geoCircle().center([HOME.lng,HOME.lat]).radius(r/69.05)();
    g.append("path").attr("class","ring").attr("d",path(c));
  }
}
function xy(lat,lng){const p=proj([lng,lat]);return T.apply(p);}
function spread(list){
  // Fan out locations that share (nearly) the same spot so each stays clickable.
  const groups=new Map();
  for(const r of list){const k=r.lat.toFixed(3)+","+r.lng.toFixed(3);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);}
  const off=new Map();
  for(const g of groups.values()){if(g.length<2){off.set(g[0],[0,0]);continue;}
    g.forEach((r,i)=>{const a=i/g.length*2*Math.PI;off.set(r,[Math.cos(a)*9,Math.sin(a)*9]);});}
  return off;
}
function pinR(r){
  const base=6.5;
  if(state.sizeBy==="pop"&&isNum(r.region_pop_50))return 4+Math.sqrt(r.region_pop_50/9.5e6)*9;
  if(state.sizeBy==="price"){const v=r[PRICE[state.tab]];if(isNum(v))return 4+Math.min(v,80)/80*9;return 4;}
  return base;
}
function drawOverlay(){
  const k=T.k;
  // county names when zoomed in
  const co=d3.select("#gCoLabels").selectAll("text").data(k>=3.2?geo.counties:[], d=>d.properties.fips);
  co.join("text").attr("class","colabel").attr("text-anchor","middle")
    .text(d=>d.properties.name).attr("x",d=>T.apply(path.centroid(d))[0]).attr("y",d=>T.apply(path.centroid(d))[1]);
  // city labels with zoom-dependent density
  const minPop=k<1.6?120000:k<3?40000:k<6?15000:0;
  const cities=geo.cities.filter(c=>c.pop>=minPop||(c.name==="Harvard"&&false));
  const cg=d3.select("#gCities").selectAll("g").data(cities,d=>d.name+d.st);
  const ce=cg.enter().append("g");ce.append("circle").attr("class","cdot").attr("r",2);ce.append("text").attr("class","clabel");
  cg.exit().remove();
  d3.select("#gCities").selectAll("g").each(function(d){const [x,y]=xy(d.lat,d.lng);const g=d3.select(this);
    g.attr("transform",`translate(${x},${y})`);g.select("text").attr("x",5).attr("y",-4).attr("class","clabel"+(d.pop>=100000?" big":"")).text(d.st==="IL"?d.name:d.name+", "+d.st);});
  // home marker
  const [hx,hy]=xy(HOME.lat,HOME.lng);
  const hg=d3.select("#gHome").selectAll("g").data([HOME]).join(en=>{const g=en.append("g").attr("class","home");
    g.append("circle").attr("r",7);g.append("text").attr("x",11).attr("y",4).text("★ Your Harvard building");return g;});
  hg.attr("transform",`translate(${hx},${hy})`);
  d3.select("#gRings").selectAll(".ring-lbl").remove();
  // pins
  const list=visible().filter(r=>isNum(r.lat)&&isNum(r.lng));
  const off=k>=4?spread(list):new Map();
  const pins=d3.select("#gPins").selectAll("g.pin").data(list,d=>d.id);
  const en=pins.enter().append("g").attr("class","pin").attr("tabindex",0).attr("role","button");
  en.append("circle").attr("class","halo");en.append("circle").attr("class","core");
  en.on("mouseenter",(e,d)=>hover(d,true)).on("mouseleave",(e,d)=>hover(d,false))
    .on("focus",(e,d)=>hover(d,true)).on("blur",(e,d)=>hover(d,false))
    .on("click",(e,d)=>{e.stopPropagation();select(d.id,false);})
    .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d.id,false);}});
  pins.exit().remove();
  d3.select("#gPins").selectAll("g.pin").each(function(d){
    const [x,y]=xy(d.lat,d.lng);const o=off.get(d)||[0,0];const g=d3.select(this);const r=pinR(d);
    const big=d.id===state.hot||d.id===state.sel;
    g.attr("transform",`translate(${x+o[0]},${y+o[1]})`)
     .classed("closed",d.status==="closed").classed("hot",d.id===state.hot).classed("sel",d.id===state.sel);
    g.select(".core").attr("r",big?r+3:r);g.select(".halo").attr("r",big?r+11:r);
    g.attr("aria-label",d.name);
  });
}
function pinScreen(d){const node=d3.select("#gPins").selectAll("g.pin").filter(x=>x.id===d.id).node();if(!node)return xy(d.lat,d.lng);const m=node.transform.baseVal.consolidate();return m?[m.matrix.e,m.matrix.f]:xy(d.lat,d.lng);}
function raisePins(){const g=document.getElementById("gPins");for(const id of [state.sel,state.hot]){if(!id)continue;const n=d3.select(g).selectAll("g.pin").filter(x=>x.id===id).node();if(n&&g.lastChild!==n&&!(id===state.sel&&state.hot&&g.lastChild&&d3.select(g.lastChild).datum()&&d3.select(g.lastChild).datum().id===state.hot))g.appendChild(n);}}
function hover(d,on){
  state.hot=on?d.id:null;drawOverlay();if(on)raisePins();markListHot();
  if(on)showBubble(d);else hideBubble();
}
function showBubble(d){
  const b=$("#bubble");const [x,y]=pinScreen(d);const P=PRICE[state.tab];
  const rows = state.tab==="haunt"
    ? [["Ticket",fmt.usd(d[P])],["Walkthrough",fmt.min(d.duration_min)],["Town pop.",fmt.int(d.town_pop)],["50-mi pop.",fmt.big(d.region_pop_50)]]
    : [["Per person",fmt.usd(d[P])],["Session",fmt.min(d.session_min)],["Town pop.",fmt.int(d.town_pop)],["50-mi pop.",fmt.big(d.region_pop_50)]];
  b.innerHTML=`<h4>${esc(d.name)}</h4><div class="t">${esc(d.town||"?")}${d.type?" · "+esc(d.type):""}${d.status==="closed"?" · closed":""}</div>
    <dl>${rows.map(([a,v])=>`<dt>${a}</dt><dd>${v==null?'<span class="unk">?</span>':esc(v)}</dd>`).join("")}</dl><div class="hint">Click for full details</div>`;
  const w=$("#mapwrap").clientWidth;

}
function hideBubble(){$("#bubble").classList.remove("on");}
function flyTo(d,k){
  const [w,h]=size();const p=proj([d.lng,d.lat]);const panelOpen=$("#panel").classList.contains("open")&&w>760;
  const cx=panelOpen?(w-420)/2:w/2;const kk=Math.max(T.k,k||6);
  svg.transition().duration(750).ease(d3.easeCubicInOut).call(zoom.transform,d3.zoomIdentity.translate(cx-p[0]*kk,h/2-p[1]*kk).scale(kk));

function placeAt(e){
  const [mx,my]=d3.pointer(e,svg.node());const [lng,lat]=proj.invert(T.invert([mx,my]));

// ---------- list + stats ----------
function visible(){
  const q=state.q.trim().toLowerCase();
  return state.data[state.tab].filter(r=>(!state.ftype||r.type===state.ftype)&&(!q||[r.name,r.town,r.county,r.brand,r.type].join(" ").toLowerCase().includes(q)));
}
function sortVal(r,s){
  switch(s){case"dist":return r._dist;case"price":return r[PRICE[state.tab]];case"pop50":return r.region_pop_50;case"att":return r.annual_attendance;
    case"dur":return r.duration_min;case"rev":return isNum(r.annual_revenue)?r.annual_revenue:isNum(r.monthly_revenue)?r.monthly_revenue*12:null;case"sqft":return r.sq_ft;}
}
function renderList(){
  const s=state.sort;const asc=s==="dist"||s==="name";
  const L=visible().slice().sort((a,b)=>{if(s==="name")return a.name.localeCompare(b.name);
    const va=sortVal(a,s),vb=sortVal(b,s);if(!isNum(va)&&!isNum(vb))return a.name.localeCompare(b.name);if(!isNum(va))return 1;if(!isNum(vb))return -1;return asc?va-vb:vb-va;});
  const P=PRICE[state.tab];
  const right=r=>{switch(s){
    case"pop50":return [fmt.big(r.region_pop_50),"50-mi pop."];case"att":return [fmt.big(r.annual_attendance),"per year"];
    case"dur":return [fmt.min(r.duration_min),"walkthrough"];case"rev":{const v=sortVal(r,"rev");return [v==null?null:"$"+fmt.big(v),"per year"];}
    case"sqft":return [fmt.int(r.sq_ft),"sq ft"];case"dist":return [fmt.mi(r._dist),fmt.usd(r[P])||(isNum(r.price_low)?"from "+fmt.usd(r.price_low):"price ?")];default:return isNum(r[P])||!isNum(r.price_low)?[fmt.usd(r[P]),state.tab==="haunt"?"avg ticket":"avg / person"]:["from "+fmt.usd(r.price_low),"starting price"];}};
  $("#list").innerHTML=L.length?L.map(r=>{const [v,sm]=right(r);return `<div class="item${r.id===state.sel?" sel":""}" data-id="${esc(r.id)}" tabindex="0">

    <span class="val">${v==null?'<span class="unk">?</span>':esc(v)}<small>${esc(sm||"")}</small></span>
    <span class="sub">${esc(r.town||"?")}${r.type?" · "+esc(r.type):""}${r.status==="closed"?" · closed":""}</span></div>`;}).join("")
    : `<div class="empty">${state.data[state.tab].length?"No locations match this search.":"Research for this tab is still loading. Locations will appear here and on the map as soon as they are added."}</div>`;
}
function markListHot(){document.querySelectorAll(".item").forEach(el=>el.classList.toggle("hot",el.dataset.id===state.hot));}
function renderStats(){

function rec(id){return state.data[state.tab].find(r=>r.id===id);}

      $("#f_lat").value=g[3];$("#f_lng").value=g[4];toast(`Placed at ${g[0]} (town center).`);};
    $("#pickMap").onclick=()=>{collect(r);state.placing=r;$("#placing").hidden=false;if(innerWidth<=760)p.classList.remove("open");};
    if(!isNew)$("#delBtn").onclick=()=>{$("#delWrap").innerHTML=`<div class="confirm">Delete “${esc(r.name)}” from the map?<button type="button" class="btn danger" id="delYes">Delete</button><button type="button" class="btn" id="delNo">Keep</button></div>`;
      $("#delYes").onclick=()=>removeRec(r);$("#delNo").onclick=()=>$("#delWrap").innerHTML="";};
    return;
  }
  const est=(r.estimated_fields||[]);
  const top = state.tab==="haunt"
    ? [[!isNum(r[P])&&isNum(r.price_low)?"Starting at":"Avg ticket",fmt.usd(isNum(r[P])?r[P]:r.price_low)],["Walkthrough",fmt.min(r.duration_min)],["Customers / yr",fmt.big(r.annual_attendance)]]
    : [[!isNum(r[P])&&isNum(r.price_low)?"Starting at":"Avg per person",fmt.usd(isNum(r[P])?r[P]:r.price_low)],["Session",fmt.min(r.session_min)],["Revenue / mo",isNum(r.monthly_revenue)?"$"+fmt.big(r.monthly_revenue):isNum(r.annual_revenue)?"$"+fmt.big(r.annual_revenue/12):null]];
  const skip=new Set(["name","type","status","town","sources","notes",P,state.tab==="haunt"?"duration_min":"session_min"]);
  p.innerHTML=`<div class="p-head"><div style="min-width:0"><h2>${esc(r.name)}</h2>
     <div class="meta">${esc(r.town||"?")}${r.county?", "+esc(r.county)+" Co.":""}${isNum(r._dist)?` · ${Math.round(r._dist)} mi from your building`:""}</div>
     <div class="chips">${r.type?`<span class="chip acc">${esc(r.type)}</span>`:""}${r.brand&&r.brand!==r.name?`<span class="chip">${esc(r.brand)}</span>`:""}${r.status==="closed"?'<span class="chip closed">Closed</span>':""}${r.season?`<span class="chip">${esc(r.season)}</span>`:""}</div></div>
     <button class="x" id="pclose" aria-label="Close">×</button></div>
   <div class="p-body">
     <div class="sec"><div class="big3">${top.map(([a,v])=>`<div><small>${a}</small><b>${v==null?'<span class="unk" style="font-size:13px">? Unable to gather</span>':esc(v)}</b></div>`).join("")}</div></div>
     <div class="sec"><h3>Population</h3><dl class="kv">
       <dt>Town</dt><dd><span class="num">${fmt.int(r.town_pop)||"?"}</span><div class="note">${esc(r.town_pop_note||"")}</div></dd>
       <dt>Within 25 miles</dt><dd class="num">${fmt.int(r.region_pop_25)||"?"}</dd>
       <dt>Within 50 miles</dt><dd><span class="num">${fmt.int(r.region_pop_50)||"?"}</span><div class="note">${isNum(r.region_towns_50)?r.region_towns_50+" towns and cities in range. ":""}2020 Census tracts, includes neighboring states.</div></dd></dl>
       ${(r.nearby_cities||[]).length?`<div class="cities" style="margin-top:8px">${r.nearby_cities.map(c=>`<div><span>${esc(c.name)} <span class="mode">${c.mi} mi</span></span><span class="num">${fmt.int(c.pop)}</span></div>`).join("")}</div>`:""}</div>
     <div class="sec"><h3>Details</h3><dl class="kv">${F[state.tab].filter(f=>!skip.has(f.k)).map(f=>`<dt>${f.l.replace(/ \(.*\)/,"")}</dt><dd>${val(r,f)}</dd>`).join("")}</dl>
       ${est.length?`<p class="note"><span class="est">EST</span> marks figures estimated from indirect sources; see notes.</p>`:""}</div>
     ${r.notes?`<div class="sec"><h3>Notes</h3><div style="line-height:1.5">${esc(r.notes)}</div></div>`:""}
     <div class="sec src"><h3>Sources</h3>${(r.sources||[]).length?r.sources.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,""))}</a>`).join(""):UNK}</div>
   </div>
   <div class="p-foot"><button class="btn" id="zoomTo">Zoom to</button><button class="btn primary" id="editBtn">Edit</button></div>`;
  $("#pclose").onclick=closePanel;$("#editBtn").onclick=()=>renderPanel(true,r);$("#zoomTo").onclick=()=>flyTo(r,9);
}
function closePanel(){$("#panel").classList.remove("open");state.sel=null;state.editing=false;drawOverlay();renderList();}
function collect(r){
  const fd=new FormData($("#ef"));
  for(const f of F[state.tab]){let v=fd.get(f.k);v=v==null?"":String(v).trim();
    if(f.t==="num")r[f.k]=v===""?null:+v;else if(f.t==="list")r[f.k]=v?v.split(/\s*\n\s*/).filter(Boolean):[];else r[f.k]=v===""?null:v;}
  const la=fd.get("lat"),lo=fd.get("lng");r.lat=la===""?null:+la;r.lng=lo===""?null:+lo;
}
async function saveForm(orig){
  const r=JSON.parse(JSON.stringify(orig));const before={lat:orig.lat,lng:orig.lng,town:orig.town};collect(r);
  if(!r.name){toast("Give the location a name first.");return;}
  if(!isNum(r.lat)||!isNum(r.lng)){toast("Set a location: Find town, Place on map, or enter coordinates.");return;}
  // Only fields the person typed in are theirs; drop any EST marker on edited numbers.
  if(r.estimated_fields)r.estimated_fields=r.estimated_fields.filter(k=>orig[k]===r[k]);
  if(r.lat!==before.lat||r.lng!==before.lng||r.town!==before.town||!isNum(r.region_pop_50))popFor(r);
  if(!r.id){r.id=state.tab+"-"+Date.now().toString(36);state.data[state.tab].push(r);}
  else{const i=state.data[state.tab].findIndex(x=>x.id===r.id);state.data[state.tab][i]=r;}
  r._dist=miles(HOME.lat,HOME.lng,r.lat,r.lng);
  state.sel=r.id;await persist();renderAll();renderPanel(false,r);flyTo(r,Math.max(T.k,5));
}
async function removeRec(r){state.data[state.tab]=state.data[state.tab].filter(x=>x.id!==r.id);closePanel();await persist();renderAll();}

// ---------- saving ----------
let artifactNS=null;
function clean(list){return list.map(r=>{const o={};for(const k in r)if(k[0]!=="_")o[k]=r[k];return o;});}
async function persist(){
  const tab=state.tab;const file=tab==="haunt"?"data/haunts.json":"data/vr.json";const body=JSON.stringify(clean(state.data[tab]),null,1);
  if(state.writable!==false&&artifactNS){
    try{await artifactNS.publish({[file]:body});state.writable=true;LS.set("draft-"+tab,null);toast("Saved. Everyone with the link sees this.");setMode();return;}
    catch(e){const c=e&&e.code;
      if(c==="conflict"){toast("Someone else just saved. Reloading their version.");return;}
      if(!["not_writer","not_granted","capability_disabled","consent_required","capability_removed","not_declared"].includes(c)){toast("Couldn't save right now. Your change is kept in this browser.");}
      else state.writable=false;}
  }
  LS.set("draft-"+tab,clean(state.data[tab]));setMode();
  toast(state.writable===false?"Saved in this browser only (view-only link).":"Saved in this browser.");
}
function setMode(){
  const hasDraft=LS.get("draft-"+state.tab);
  $("#mode").textContent=state.writable===false?(hasDraft?"View-only · showing your local edits":"View-only link"):"";
}

// ---------- wiring ----------
function renderAll(){
  const app=$("#app");app.dataset.tab=state.tab;
  $("#subtitle").textContent=state.tab==="haunt"?"Haunted attractions · statewide":"Virtual reality venues · statewide";
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===state.tab)));
  $("#sort").innerHTML=SORTS[state.tab].map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
  if(!SORTS[state.tab].some(s=>s[0]===state.sort))state.sort="dist";$("#sort").value=state.sort;
  $("#ftype").innerHTML=`<option value="">All</option>`+TYPES[state.tab].map(t=>`<option>${esc(t)}</option>`).join("");$("#ftype").value=state.ftype;
  renderStats();renderList();renderLegend();renderIndustry();drawOverlay();setMode();
}
function switchTab(t){if(t===state.tab)return;state.tab=t;state.sel=null;state.hot=null;state.ftype="";$("#panel").classList.remove("open");
  try{location.hash=t==="vr"?"vr":"haunted";}catch(e){}
  renderAll();}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$("#q").oninput=e=>{state.q=e.target.value;renderList();drawOverlay();};
$("#sort").onchange=e=>{state.sort=e.target.value;renderList();};
$("#ftype").onchange=e=>{state.ftype=e.target.value;renderList();drawOverlay();};
$("#list").addEventListener("click",e=>{const it=e.target.closest(".item");if(it)select(it.dataset.id,true);});
$("#list").addEventListener("keydown",e=>{const it=e.target.closest(".item");if(it&&(e.key==="Enter"||e.key===" ")){e.preventDefault();select(it.dataset.id,true);}});
$("#list").addEventListener("mouseover",e=>{const it=e.target.closest(".item");const id=it?it.dataset.id:null;if(id!==state.hot){state.hot=id;drawOverlay();markListHot();const r=id&&rec(id);if(r&&isNum(r.lat))showBubble(r);else hideBubble();}});
$("#list").addEventListener("mouseleave",()=>{state.hot=null;drawOverlay();markListHot();hideBubble();});
$("#addBtn").onclick=()=>{state.sel=null;renderPanel(true,{status:"open",sources:[]});};
$("#railBtn").onclick=()=>$("#rail").classList.toggle("open");
$("#zin").onclick=()=>svg.transition().duration(350).call(zoom.scaleBy,1.8);
$("#zout").onclick=()=>svg.transition().duration(350).call(zoom.scaleBy,1/1.8);
$("#zfit").onclick=()=>svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(state.placing){state.placing=null;$("#placing").hidden=true;$("#panel").classList.add("open");}else if(!state.editing)closePanel();}});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(geo){setupMap();drawOverlay();}},150);});

async function getJSON(u){try{const r=await fetch(u,{cache:"no-store"});if(!r.ok)return null;return await r.json();}catch(e){return null;}}
function prep(list,tab){return (Array.isArray(list)?list:[]).map((r,i)=>{if(!r.id)r.id=tab+"-"+i;if(!r.status)r.status="open";
  if(isNum(r.lat)&&isNum(r.lng))r._dist=miles(HOME.lat,HOME.lng,r.lat,r.lng);return r;});}

async function unlockVault(){
  const vault=await getJSON("data/vault.json");if(!vault)throw new Error("Data file missing");
  const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function tryPass(p){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(vault.salt),iterations:vault.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(vault.iv)},key,u(vault.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  let saved=null;try{saved=localStorage.getItem("vs-pass");}catch(e){}
  if(saved){try{const d=await tryPass(saved);$("#lock").hidden=true;document.title="Illinois Venue Scout";return d;}catch(e){try{localStorage.removeItem("vs-pass");}catch(_){}}}
  $("#pass").focus();
  return new Promise(res=>{$("#lockForm").onsubmit=async ev=>{ev.preventDefault();const p=$("#pass").value;
    $("#unlockBtn").disabled=true;$("#lockErr").textContent="Checking…";
    try{const d=await tryPass(p);try{localStorage.setItem("vs-pass",p);}catch(e){}$("#lock").hidden=true;document.title="Illinois Venue Scout";res(d);}
    catch(e){$("#lockErr").textContent="That passcode didn't work.";$("#unlockBtn").disabled=false;$("#pass").select();}};});
}
(async function boot(){
  if((location.hash||"").replace("#","")==="vr")state.tab="vr";
  const g=await getJSON("data/geo.json");const vd=await unlockVault();const h=vd.haunts,v=vd.vr,ind=vd.industry;
  geo=g;state.industry=ind;
  state.data.haunt=prep(h,"haunt");state.data.vr=prep(v,"vr");
  for(const t of ["haunt","vr"]){const d=LS.get("draft-"+t);if(Array.isArray(d)&&d.length)state._drafts=(state._drafts||{}),state._drafts[t]=d;}
  if(!geo){$("#mapwrap").insertAdjacentHTML("beforeend",'<div class="placing">Map data failed to load. Reload the page.</div>');return;}
  setupMap();renderAll();
  
  if(window.claude&&window.claude.use){try{artifactNS=await window.claude.use("artifact");}catch(e){artifactNS=null;}}
  if(!artifactNS){state.writable=false;
    // apply this browser's local edits when the page can't save for everyone
    if(state._drafts){for(const t in state._drafts)state.data[t]=prep(state._drafts[t],t);renderAll();}}
  setMode();
})();
addEventListener("hashchange",()=>{const t=(location.hash||"").replace("#","")==="vr"?"vr":"haunt";if(t!==state.tab){state.tab=t;state.sel=null;$("#panel").classList.remove("open");renderAll();}});
})();
</script>
